<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="index.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
</head>

<body>

  <h1>Account Registration Form</h1>

  <form class="form-container" id="registrationForm"> 

    <!--  first name, last name, dob, email, gender, phone number, address, ext contact info, account type, id card type, id number, password
    1. personal details, 2. account information -->

    <!-- Personal Information -->
    <div class="personal-info-section">

      <label>Personal Information</label>

      <input type="text" placeholder="First Name" id="firstName">

      <input type="text" placeholder="Last Name" id="lastName">

      <select id="gender">
        <option value="">Select Gender</option>
        <option value="FEMALE">Female</option>
        <option value="MALE">Male</option>
      </select>

      <input type="tel" placeholder="Phone Number" id="phoneNumber">

      <input type="date" placeholder="Date of Birth" id="dateOfBirth">

      <textarea cols="60" rows="3" placeholder="Full Address" id="address"></textarea>

    </div>

    <!-- External Contact Information -->
    <div class="ext-contact-section">

      <label>External Contact Information</label>

      <input type="text" placeholder="External First Name" id="externalFirstName">

      <input type="text" placeholder="External Last Name" id="externalLastName">

      <input type="tel" placeholder="External Phone Number" id="externalPhoneNumber">

      <input type="email" placeholder="External Email" id="externalEmail">

    </div>

    <!-- Account Information -->
    <div class="account-section">

      <div>
        <label>Account Type</label>

        <select id="accountType">
          <option value="1">Savings</option>
          <option value="2">Current</option>
          <option value="3">Domiciliary</option>
        </select>
      </div>

      <div>
        <label>ID Type</label>

        <select id="idType">
          <option value="1">Voter's Card</option>
          <option value="2">Driver's License</option>
          <option value="3">International Passport</option>
          <option value="4">Others</option>
        </select>
      </div>

    </div>

    <!-- Password Section -->
    <div class="password-section">

      <input type="password" placeholder="Password" id="password">

      <input type="password" placeholder="Re-enter Password" id="confirmPassword">

    </div>

    <!-- Submit Button -->
    <button type="submit">Register Account</button>

  </form>
  
  <!-- Container to display saved form records dynamically via JavaScript -->

  <div id="output" class="output-section"></div>


  <!-- Linked External JavaScript File right before body closes -->
    <script src="script.js"></script>
    
</body>

</html>
